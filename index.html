<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sci‑Fi Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
  
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #101b3a 0, #050814 55%, #000 100%);
      color: var(--text-main);
      font-family: var(--font-main);
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.04) 1px,
        transparent 1px
      );
      background-size: 100% 3px;
      mix-blend-mode: soft-light;
      opacity: 0.25;
      z-index: 0;
    }

    .calculator-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      margin: 16px;
      padding: 18px;
      border-radius: 22px;
      background: radial-gradient(circle at top left, #1b2a4a 0, #050814 55%);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), var(--shadow-soft);
      border: 1px solid rgba(52, 209, 255, 0.4);
      overflow: hidden;
    }

    .calculator-shell::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 10% 0, rgba(0, 245, 160, 0.12), transparent 55%),
        radial-gradient(circle at 90% 100%, rgba(52, 209, 255, 0.18), transparent 55%);
      opacity: 0.9;
      pointer-events: none;
      z-index: -1;
    }

    .calc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(52, 209, 255, 0.25);
    }

    .calc-title {
      font-size: 0.9rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .calc-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: var(--accent);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent-strong);
      box-shadow: 0 0 10px var(--accent-strong);
      animation: pulse 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }

    .display-secondary {
      min-height: 21px;
      text-align: right;
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 10px;
      margin-bottom: 4px;
      word-wrap: break-word;
    }

    .display-main {
      text-align: right;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 500;
      color: var(--accent-strong);
      text-shadow: 0 0 12px rgba(0, 245, 160, 0.7);
      word-wrap: break-word;
      min-height: 3rem;
    }

    .display-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 0, rgba(0, 245, 160, 0.18), transparent 55%);
      opacity: 0.7;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    /* --- エラーコンソール追加 --- */
    .error-console {
      margin-top: 6px;
      min-height: 18px;
      font-size: 0.7rem;
      color: var(--danger);
      text-align: right;
      opacity: 0.9;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    :root {
  --bg: #02030a;
  --panel: rgba(10, 20, 40, 0.75);
  --accent: #00ffc8;
  --accent-soft: #35f0ff;
  --danger: #ff4b81;
  --text: #d8ffe9;
  --dim: #6e7fa3;
  --border: rgba(0,255,200,0.15);
  --radius: 14px;
  --mono: "JetBrains Mono", monospace;
}

body {
  background:
    radial-gradient(circle at 20% 10%, rgba(0,255,200,0.15), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(0,255,200,0.08), transparent 40%),
    #000;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: var(--mono);
  color: var(--text);
}

/* MAIN CALCULATOR PANEL */
.calc {
  width: min(420px, 100vw - 20px);
  background: var(--panel);
  backdrop-filter: blur(14px);
  padding: 18px;
  border-radius: 20px;
  border: 1px solid var(--border);

  /* layered glow */
  box-shadow:
    0 0 10px rgba(0,255,200,0.15),
    0 0 30px rgba(0,255,200,0.1),
    inset 0 0 20px rgba(0,255,200,0.05);
}

/* DISPLAY */
.display {
  background: rgba(5, 15, 25, 0.8);
  border: 1px solid rgba(0,255,200,0.3);
  padding: 14px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;

  /* glow */
  box-shadow: inset 0 0 10px rgba(0,255,200,0.2);
}

/* subtle scanline effect */
.display::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.03),
    rgba(255,255,255,0.03) 1px,
    transparent 2px,
    transparent 4px
  );
  pointer-events: none;
}

#expr {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--accent);
  font-size: 1.2rem;
  resize: none;
  overflow-y: auto;
  min-height: 1.4em;
  text-shadow: 0 0 6px rgba(0,255,200,0.6);
}

#result {
  text-align: right;
  margin-top: 6px;
  font-size: 1.5rem;
  color: var(--text);
  text-shadow: 0 0 8px rgba(0,255,200,0.8);
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

/* BASE BUTTON (now calmer) */
.btn {
  padding: 14px 0;
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,0.05);
  background: rgba(5, 10, 20, 0.9); /* darker */
  color: rgba(220, 255, 240, 0.85);
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.15s ease;

  /* remove strong glow */
  box-shadow: none;
}

/* subtle hover only */
.btn:hover {
  border-color: rgba(0,255,200,0.2);
  color: var(--text);
  background: rgba(10, 20, 35, 0.95);
  transform: translateY(-1px);
}

/* click feel */
.btn:active {
  transform: scale(0.96);
  background: rgba(0, 255, 200, 0.08); /* tiny feedback glow */
}

.btn-op {
  color: var(--accent-soft);
  border-color: rgba(53,240,255,0.25);
  text-shadow: 0 0 4px rgba(53,240,255,0.6);
}

.btn-op:hover {
  box-shadow: 0 0 10px rgba(53,240,255,0.3);
}
/* EQUAL BUTTON (MAIN GLOW) */
.btn-eq {
  background: linear-gradient(135deg, #00ffc8, #35f0ff);
  color: #001010;
  font-weight: bold;
  border: none;

  box-shadow:
    0 0 20px rgba(0,255,200,0.8),
    0 0 40px rgba(0,255,200,0.4);
}

.btn-eq:hover {
  box-shadow:
    0 0 30px rgba(0,255,200,1),
    0 0 60px rgba(0,255,200,0.6);
}

/* FUNCTION BUTTON */
.btn-func {
  color: var(--danger);
  border-color: rgba(255,75,129,0.5);
  text-shadow: 0 0 6px rgba(255,75,129,0.7);
}

/* WIDE BUTTON */
.wide {
  grid-column: span 2;
}

.cursor{
        animation: blink 1s infinite;
    }
@keyframes blink {
        0%   { opacity: 1; }
        50%  { opacity: 0; }
        100% { opacity: 1; }
    }

  </style>
</head>

<body>
  <div class="scanlines"></div>

  <div class="calculator-shell">
    <header class="calc-header">
      <div class="calc-title">NEBULA CALC v1.1</div>
      <div class="calc-status">
        <div class="status-dot"></div>
        <span>ONLINE</span>
      </div>
    </header>

    <section class="display">
      <div class="display-glow"></div>
      <div class="display-secondary" id="display-history">READY</div>
      <div class="display-main" id="display-main">0</div>
    </section>

    <!-- ★ エラーコンソール追加 -->
    <div class="error-console" id="error-console"></div>

    <main class="keypad">
      <!-- 上段：±削除 → ^追加 -->
      <button class="btn btn-func wide" data-type="clear-all" data-value="AC" data-label="SYS" onclick="deleteAll()">AC</button>
      <button class="btn btn-func wide" data-type="clear-entry" data-value="CE" data-label="MEM" onclick="deleteEle()">CE</button>

      <!-- ★ ± 削除 → ^ 追加 -->
       <!-- Row 2: ( ) + two operators -->
      <button class="btn" data-key="(" data-type="operator" data-value="(">(</button>
      <button class="btn" data-key=")" data-type="operator" data-value=")">)</button>
      <button class="btn btn-op" data-type="operator" data-value="^" data-label="POW">^</button>

      <button class="btn btn-op" data-type="operator" data-value="÷" data-label="DIV">÷</button>

      <!-- 数字 -->
      <button class="btn" data-type="digit" data-value="7" data-label="NUM">7</button>
      <button class="btn" data-type="digit" data-value="8" data-label="NUM">8</button>
      <button class="btn" data-type="digit" data-value="9" data-label="NUM">9</button>
      <button class="btn btn-op" data-type="operator" data-value="×" data-label="MUL">×</button>

      <button class="btn" data-type="digit" data-value="4" data-label="NUM">4</button>
      <button class="btn" data-type="digit" data-value="5" data-label="NUM">5</button>
      <button class="btn" data-type="digit" data-value="6" data-label="NUM">6</button>
      <button class="btn btn-op" data-type="operator" data-value="-" data-label="SUB">−</button>

      <button class="btn" data-type="digit" data-value="1" data-label="NUM">1</button>
      <button class="btn" data-type="digit" data-value="2" data-label="NUM">2</button>
      <button class="btn" data-type="digit" data-value="3" data-label="NUM">3</button>
      <button class="btn btn-op" data-type="operator" data-value="+" data-label="ADD">+</button>

      <button class="btn wide" data-type="digit" data-value="0" data-label="NUM">0</button>
      <button class="btn" data-type="decimal" data-value="." data-label="DEC">.</button>
      <button class="btn btn-eq" data-type="equals" data-value="=" data-label="SOLVE" onclick="calculate()">=</button>
    </main>
  </div>
  <script src="javascript.js"></script>
</body>

</html>
